<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Dashboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>📊 Personal Finance Dashboard</h1>
      <div
        class="summary-card"
        style="
          background: #2c3e50;
          color: white;
          padding: 20px;
          border-radius: 10px;
          margin: 20px 0;
        "
      >
        <h2 style="margin: 0; font-size: 1.2rem; opacity: 0.8">
          Total Spending
        </h2>
        <p style="margin: 5px 0 0 0; font-size: 2.5rem; font-weight: bold">
          ${{ "%.2f"|format(total_spent) }}
        </p>
      </div>
      <div class="actions">
        <a href="/upload" class="btn">Upload CSV</a>
      </div>
      <a
        href="/clear"
        class="btn"
        style="background-color: #e74c3c"
        onclick="return confirm('Are you sure you want to delete all data?')"
        >Clear All Data</a
      >

      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
      <hr />
      <h3>Recent Transactions</h3>
      <table style="width: 100%; margin-top: 20px; border-collapse: collapse">
        <thead>
          <tr style="background-color: #f2f2f2">
            <th>Date</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          {% for t in transactions %}
          <tr style="border-bottom: 1px solid #ddd; text-align: center">
            <td>{{ t.date }}</td>
            <td>{{ t.category }}</td>
            <td>{{ t.description }}</td>
            <td>${{ "%.2f"|format(t.amount) }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script>
      const chartLabels = {{ labels | safe }};
      const chartValues = {{ values | safe }};

      const ctx = document.getElementById('expenseChart').getContext('2d');

      new Chart(ctx, {
          type: 'doughnut',
          data: {
              labels: chartLabels,
              datasets: [{
                  label: 'Spending by Category',
                  data: chartValues,
                  backgroundColor: [
                      '#3498db', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6'
                  ],
                  borderWidth: 1
              }]
          },
          options: {
              responsive: true,
              maintainAspectRatio: false
          }
      });
    </script>
  </body>
</html>
